; Development tracking profile, NOT a finished physical-combat mod.
; Use this section with witcher3vr.ini; launcher has no controls for it yet.
[motion_controllers]
enabled=1
diagnostics=1

[openxr]
enabled=1
mode=3
mode3_aer_presentation=0
native_stereo=1
resolution_auto=0
render_width=2064
render_height=2208
resolution_scale=1.0
presentation_scale=1.0
world_detail_range=0.6
hmd_freelook=1
hmd_position_scale=1.0

[engine]
temporal_backend=dlss
raytracing_enabled=0
camera_mode=2
